name: Upstream sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # A personal token, not GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN starts no
      # other workflows, so CI would not run on it, and GITHUB_TOKEN cannot push commits that
      # touch .github/workflows/, which upstream edits.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch https://github.com/scm-js/scm-js.git main:refs/remotes/upstream/main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already has every upstream commit"
            exit 0
          fi

          open_pr=$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$open_pr" ]; then
            git push --force origin upstream/main:refs/heads/sync/upstream
            gh pr create --head sync/upstream --base main --title "Merge upstream/main" \
              --body "New commits from scm-js/scm-js main. Merge with a merge commit, not a squash, so they stay shared history with upstream."
            exit 0
          fi

          # An open pull request may carry a conflict resolution, so add to its branch rather than resetting it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/upstream origin/sync/upstream
          git merge --no-edit upstream/main
          git push origin sync/upstream
